<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>场景模型检视</title>
<style>
body{margin:0;background:#202b35;color:#eee7d9;font:16px/1.6 system-ui}header{padding:24px 32px}h1{margin:0;font-size:26px}p{max-width:72ch;margin:8px 0 20px}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px}select,button{font:inherit;color:inherit;background:#26343d;border:1px solid #607078;min-height:44px;padding:4px 12px}button{cursor:pointer}button:hover{background:#3b4b55}button:disabled{opacity:.5}select:focus-visible,button:focus-visible{outline:3px solid #e5d4b5;outline-offset:3px}::selection{background:#e5d4b5;color:#1d2931}#scene{height:60vh;min-height:330px}canvas{display:block}#status{padding:12px 32px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}footer{padding:0 32px 24px;color:#c0c9cb;max-width:75ch}
</style>
<header><h1>场景模型检视</h1><p>房屋、地面与环境模块的原生导出。固定灯光、65° 垂直视野，可切换地面眼高与总览。观象台整套导出用于交接，城市运行时使用分块模块。</p><div class="controls"><label>模型<select id="model"><option value="house_terrace">错层平顶</option><option value="house_tower">高冠建筑</option><option value="house_terrace_ruined">平顶废墟</option><option value="house_tower_ruined">高冠废墟</option><option value="ground_slab">平地板</option><option value="ground_band">纹带地面</option><option value="ground_platform">台地</option><option value="wall_corner">角墙</option><option value="railing">栏杆</option><option value="stone_cluster">石簇</option><option value="supply_crate">木箱</option><option value="route_flag">方向旗帜</option><option value="observatory_assembly">观象台整套</option></select></label><label>观察距离<select id="distance"><option value="20">20 米</option><option value="5">5 米</option><option value="50">50 米</option></select></label><label>视角<select id="angle"><option value="0.65">斜侧面</option><option value="0">正面</option><option value="3.141592653589793">背面</option></select></label><label>眼高<select id="height"><option value="1.645">地面 · 1.645 米</option><option value="26">总览 · 26 米</option></select></label><button id="reload">重新加载</button></div></header>
<div id="scene" aria-label="建筑三维检视"></div><div id="status" role="status">加载中</div><footer>房屋为非可进入背景外壳。此页不验证碰撞、撤离路线或灾变切换。</footer><script type="module" src="./building-preview.ts"></script>
</html>
