<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核心模型原生往返检视</title>
<style>body{margin:0;background:#18262b;color:#f0e5d0;font:16px/1.6 system-ui,sans-serif}header{padding:20px 32px}h1{margin:0;font-size:24px}p{margin:8px 0}label{margin-right:20px}select,button{font:inherit;padding:8px 12px;background:#30474f;color:inherit;border:1px solid #b7c6c9;min-height:44px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e0b976;outline-offset:3px}#scene{height:60vh;min-height:320px}canvas{display:block}footer{display:flex;justify-content:space-around;padding:16px}#status{overflow-wrap:anywhere}</style>

<div id="scene" aria-label="模型并排比较"></div><footer><span>运行时顶点色</span><span>原生嵌入纹理</span></footer><script type="module" src="./model-roundtrip-preview.ts"></script></html>
