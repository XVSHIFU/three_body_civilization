<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仪器模型检视</title><style>body{margin:0;background:#202b35;color:#eee7d9;font:16px/1.6 system-ui}header{padding:24px 32px}h1{margin:0;font-size:26px}p{max-width:72ch;margin:8px 0 20px}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px}select,button,input{font:inherit;color:inherit;background:#26343d;border:1px solid #607078;min-height:44px;padding:4px 12px;box-sizing:border-box}input{width:130px}button{cursor:pointer}button:hover{background:#3b4b55}button:disabled{opacity:.5}select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #e5d4b5;outline-offset:3px}::selection{background:#e5d4b5;color:#1d2931}#scene{height:60vh;min-height:330px}canvas{display:block}#status{padding:12px 32px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}footer{padding:0 32px 24px;color:#c0c9cb;max-width:75ch}</style><header><h1>仪器模型检视</h1><p>读取正式模型与材质设置，以 65° 垂直视野检查轮廓。距离为摄像机到模型原点的水平距离，眼高 1.645 米；不替代现场光照和交互验收。</p><div class="controls"><label>模型<select id="model"><option value="thermometer">温度仪</option><option value="archive_desk">档案台</option></select></label><label>观察距离<select id="distance"><option value="5">5 米</option><option value="20">20 米</option><option value="50">50 米</option></select></label><label>视角<select id="angle"><option value="0">正面</option><option value="0.65">斜侧面</option><option value="3.141592653589793">背面</option></select></label><label>样本温度（°C）<input id="temperature" type="number" value="28" min="-20" max="80" step="1"></label><button id="reload">重新加载</button></div></header><div id="scene" aria-label="仪器三维检视"></div><div id="status" role="status">加载中</div><footer>固定检视灯光；不改变游戏天空或存档。温度值只用于检查指针行程，不会成为观测证据。50 米处不要求读取刻度，但应评估轮廓辨识。</footer><script type="module" src="./instrument-preview.ts"></script></html>
